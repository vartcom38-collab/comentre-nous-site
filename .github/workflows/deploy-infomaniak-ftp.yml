name: Build and deploy static site to Infomaniak FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infomaniak-ftp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      INFOMANIAK_FTP_PASSWORD_VALUE: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      COMENTRE_DB_PASSWORD_VALUE: ${{ secrets.COMENTRE_DB_PASSWORD }}
      COMENTRE_ORDERS_ADMIN_KEY_VALUE: ${{ secrets.COMENTRE_ORDERS_ADMIN_KEY }}
      AURELIE_ORDER_EMAIL_VALUE: ${{ secrets.AURELIE_ORDER_EMAIL }}
      STRIPE_CONNECT_CLIENT_ID_VALUE: ${{ secrets.STRIPE_CONNECT_CLIENT_ID }}
      STRIPE_CONNECT_SECRET_KEY_VALUE: ${{ secrets.STRIPE_CONNECT_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FTP password secret
        run: |
          if [ -z "$INFOMANIAK_FTP_PASSWORD_VALUE" ]; then
            echo "Missing secret INFOMANIAK_FTP_PASSWORD"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Write secure orders runtime config when secrets are available
        shell: bash
        run: |
          mkdir -p out/api/comentre
          rm -f out/api/comentre/_runtime.php
          if [ -n "$COMENTRE_DB_PASSWORD_VALUE" ] && [ -n "$COMENTRE_ORDERS_ADMIN_KEY_VALUE" ]; then
            cat > out/api/comentre/_runtime.php <<PHP
          <?php
          return [
            'db_host' => 'ng43h.myd.infomaniak.com',
            'db_port' => 3306,
            'db_name' => 'ng43h__comentrenous',
            'db_user' => 'ng43h_comentreno',
            'db_password' => '${COMENTRE_DB_PASSWORD_VALUE}',
            'admin_key' => '${COMENTRE_ORDERS_ADMIN_KEY_VALUE}',
            'aurelie_order_email' => '${AURELIE_ORDER_EMAIL_VALUE}',
            'stripe_connect_client_id' => '${STRIPE_CONNECT_CLIENT_ID_VALUE}',
            'stripe_connect_secret_key' => '${STRIPE_CONNECT_SECRET_KEY_VALUE}',
            'stripe_connect_redirect_uri' => 'https://comentrenous.marionbolomey.fr/api/comentre/papeterie-stripe-callback.php',
            'allowed_origins' => [
              'https://comentrenous.marionbolomey.fr',
              'https://cometrenous.marionbolomey.fr'
            ],
          ];
          PHP
            echo "Orders runtime config created."
          else
            echo "Orders backend not activated yet: COMENTRE_DB_PASSWORD and/or COMENTRE_ORDERS_ADMIN_KEY missing."
          fi

      - name: Write deploy version marker
        run: |
          echo "${GITHUB_SHA}" > out/deploy-version.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" >> out/deploy-version.txt

      - name: Install resilient FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to Infomaniak by FTP
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "ng43h_comentrenous","${INFOMANIAK_FTP_PASSWORD_VALUE}" ftp://ng43h.ftp.infomaniak.com <<'LFTP'
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 20
          set net:max-retries 12
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set xfer:clobber on
          mirror -R --continue --verbose --parallel=2 ./out/ ./sites/comentrenous.marionbolomey.fr/
          bye
          LFTP
