name: Build and deploy static site to Infomaniak FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infomaniak-ftp-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      INFOMANIAK_FTP_PASSWORD_VALUE: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FTP password secret
        run: |
          if [ -z "$INFOMANIAK_FTP_PASSWORD_VALUE" ]; then
            echo "Missing secret INFOMANIAK_FTP_PASSWORD"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Deploy to Infomaniak by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ng43h.ftp.infomaniak.com
          username: ng43h_comentrenous
          password: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
          port: 21
          local-dir: ./out/
          server-dir: ./sites/comentrenous.marionbolomey.fr/
          protocol: ftp
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-v2.json
